; pepper-robot-bridge - eksempel paa konfiguration
;
; Defaults er kodede i src/pepper_bridge/config.py - denne fil viser ALLE
; tilgaengelige noegler og bruges som reference. Kopiér den til local.ini
; og tilpas til din opsaetning.
;
; Precedence: defaults < denne INI < miljovariabler < CLI-args.

[robot]
; IP-adresse paa Pepper/NAO. Tryk paa robotens maveknap for at hoere den.
; ENV-override: PEPPER_ROBOT_IP
; CLI-override: --robot-ip <IP>
ip = 192.168.1.155
; NAOqi-port. Default 9559. Sjaeldent noedvendigt at aendre.
; ENV-override: PEPPER_ROBOT_PORT
; CLI-override: --robot-port <PORT>
port = 9559

[server]
; Bind-host for HTTP-serveren. Tom = alle interfaces.
; ENV-override: PEPPER_BRIDGE_HOST
host =
; Bind-port for HTTP-serveren.
; ENV-override: PEPPER_BRIDGE_PORT
port = 8080

[gestures]
; Komma-separeret liste af gesture-tags brugt af cycling-logikken i say().
; Tags skal accepteres af ALAnimationPlayer.runTag() paa robotten.
list = hello,happy,calm,enthusiastic,beseech,cool,bow,body language,exalted,but

[intro]
; Opstarts-flow. Alle felter er valgfrie. Tom streng = trin springes over.
; Hvis ingen af felterne er udfyldt, koeres ingen intro overhovedet.

; Gesture-tag der afspilles foerst.
animation_tag = cloud

; URL som tablet-WebView pejes paa. Foretrukken metode (peger paa et eksternt UI).
; Hvis sat, vinder over image_path.
image_url =

; Lokal billed-sti vist via legacy data-URI flow. Filen skal findes paa
; bridge-maskinen.
image_path =

; Sætning der siges via TTS som sidste trin.
welcome_text = Hello, I am a Pepper robot

[logging]
; Python-logging-niveau. DEBUG / INFO / WARNING / ERROR / CRITICAL.
; ENV-override: PEPPER_LOG_LEVEL
level = INFO
